name: Feature request
description: Suggest something new or a change to how something works.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you are trying to do
      description: The task or problem behind the request, so the best solution can be found.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you would like
      description: How you picture it working.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: What you do today instead
      description: Workarounds or other tools you use for it.

  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Screenshots, mock-ups or links.
