  <path d="M150 370 L150 142 L362 370 L362 142" fill="none" stroke="#5ec4ff" stroke-width="52" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="150" cy="370" r="40" fill="#0f1419" stroke="#8bd49c" stroke-width="26"/>
  <circle cx="362" cy="142" r="40" fill="#0f1419" stroke="#8bd49c" stroke-width="26"/>
</svg>
