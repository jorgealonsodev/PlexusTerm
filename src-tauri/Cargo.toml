[package]
name = "plexusterm"
version = "0.2.20"
description = "Terminal and remote-session manager for Linux"
authors = ["Jorge Alonso"]
license = "MIT"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "plexusterm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
thiserror = "2"
russh = "0.64"
tokio = { version = "1", features = ["full"] }
russh-sftp = "3.0"
tauri-plugin-dialog = "2"
serialport = { version = "4", default-features = false }
keyring = "4.2.0"
keyring-core = "1.0.1"
tauri-plugin-clipboard-manager = "2"
# Desktop notifications when a terminal asks for attention (bell, OSC 9/777/99).
tauri-plugin-notification = "=2.5.1"
# OS random source for SSH key generation (Tools > SSH key generator).
rand = { version = "0.10.3", default-features = false, features = ["sys_rng"] }
zeroize = "1.8"
# PuTTY .ppk v3 export (Argon2id + HMAC-SHA-256); same versions ssh-key already uses.
argon2 = { version = "=0.6.0", default-features = false, features = ["alloc"] }
hmac = "=0.13.0"
# Private temporary folders for SFTP files opened in desktop programs (already a dev-dependency).
tempfile = "3.27.0"
# AI providers over HTTPS (same version Tauri already pulls in); rustls with the OS trust store.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
# Legacy text encodings (Windows-1252, Shift_JIS...) the file viewer reads and saves.
encoding_rs = "0.8.42"
# Verified update payloads and safe, non-extracting portable archive reads.
sha2 = "0.11"
flate2 = "1"
tar = "0.4"
# Terminal sharing through plexusterm-relay: the sans-IO sharer engine and its wire types,
# over a TLS WebSocket (the relay is only reachable over wss://).
plexusterm-share-client = { git = "https://github.com/jorgealonsodev/plexusterm-relay", rev = "5b330608fbfa3b4625826f6f3c0b42f0aec583eb" }
plexusterm-share-protocol = { git = "https://github.com/jorgealonsodev/plexusterm-relay", rev = "5b330608fbfa3b4625826f6f3c0b42f0aec583eb" }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-native-roots"] }
futures-util = "0.3"
# QR codes of share links, drawn as SVG.
qrcode = { version = "0.14", default-features = false, features = ["svg"] }

[dev-dependencies]
# A real relay for the sharing end-to-end tests.
plexusterm-relay = { git = "https://github.com/jorgealonsodev/plexusterm-relay", rev = "5b330608fbfa3b4625826f6f3c0b42f0aec583eb" }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# The screen colour picker: X11 directly (same x11rb as the clipboard plugin), or the desktop
# portal over D-Bus on Wayland (same zbus as the Tauri plugins).
[target.'cfg(target_os = "linux")'.dependencies]
x11rb = "0.13.2"
zbus = "5.19.0"
libc = "0.2"

# Keeping the system awake while a tab is shared.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_System_Power",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_Threading",
  "Win32_System_SystemInformation",
  "Win32_System_Registry",
  "Win32_System_Com",
  "Win32_Foundation",
] }
winreg = "0.56"
