[package]
name = "plexusterm"
version = "0.1.4"
description = "Terminal and remote-session manager for Linux"
authors = ["Jorge Alonso"]
license = "MIT"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "plexusterm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
thiserror = "2"
russh = "0.64"
tokio = { version = "1", features = ["full"] }
russh-sftp = "3.0"
tauri-plugin-dialog = "2"
serialport = { version = "4", default-features = false }
keyring = "4.2.0"
keyring-core = "1.0.1"
tauri-plugin-clipboard-manager = "2"
# OS random source for SSH key generation (Tools > SSH key generator).
rand = { version = "0.10.3", default-features = false, features = ["sys_rng"] }
zeroize = "1.8"
# PuTTY .ppk v3 export (Argon2id + HMAC-SHA-256); same versions ssh-key already uses.
argon2 = { version = "=0.6.0", default-features = false, features = ["alloc"] }
hmac = "=0.13.0"
# Private temporary folders for SFTP files opened in desktop programs (already a dev-dependency).
tempfile = "3.27.0"
# AI providers over HTTPS (same version Tauri already pulls in); rustls with the OS trust store.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
